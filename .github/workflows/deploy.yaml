name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA/tag to use (optional):"
        required: false
      deploy_env:
        description: "Write .env to server from secrets (PG_*, APP_ENV)"
        type: boolean
        required: false
        default: false
      run_migrations:
        description: "Run Flyway against prod Postgres via SSH tunnel"
        type: boolean
        required: false
        default: false

env:
  SELECTED_COMMIT: ${{ inputs.commit_sha || github.sha }}
  DEPLOY_ENV: ${{ inputs.deploy_env }}
  RUN_MIGRATIONS: ${{ inputs.run_migrations }}
  SSH_PORT: 18765
  REMOTE_PATH: api.mathieulalonde.com
  # Required secrets:
  # - SSH_USER, SSH_HOST, SSH_PRIVATE_KEY
  # - PG_DB, PG_USER, PG_PASSWORD (when deploy_env or run_migrations)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SELECTED_COMMIT }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -p $SSH_PORT -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Validate REMOTE_PATH
        run: |
          # Ensure REMOTE_PATH is not empty
          [ -n "$REMOTE_PATH" ] || { echo "REMOTE_PATH is empty"; exit 1; }
          
          # Ensure it matches expected domain format (contains a dot)
          echo "$REMOTE_PATH" | grep -q '\.com$' || { echo "REMOTE_PATH must be a .com domain: $REMOTE_PATH"; exit 1; }
          
          # Verify remote directory exists
          ssh -p $SSH_PORT ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "test -d ~/www/$REMOTE_PATH" || \
            { echo "Remote directory ~/www/$REMOTE_PATH does not exist"; exit 1; }
          
          echo "✓ REMOTE_PATH validated: $REMOTE_PATH"
          echo "✓ Destination: ~/www/$REMOTE_PATH/ (vendor, composer.json)"
          echo "✓ Web root: ~/www/$REMOTE_PATH/public_html/ (from ./public/)"

      - name: Ensure server .env
        if: env.DEPLOY_ENV == 'true'
        env:
          APP_ENV: production
          PG_HOST: localhost
          PG_PORT: 5432
          PG_SSLMODE: prefer
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          cat > server.env <<EOF
          APP_ENV=$APP_ENV
          PG_HOST=$PG_HOST
          PG_PORT=$PG_PORT
          PG_DB=$PG_DB
          PG_USER=$PG_USER
          PG_PASSWORD=$PG_PASSWORD
          PG_SSLMODE=$PG_SSLMODE
          EOF
          scp -P $SSH_PORT server.env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/www/$REMOTE_PATH/.env
          rm -f server.env

      # Flyway cannot run on SiteGround shared hosting. Open an SSH tunnel to the
      # account shell and forward local 5432 → server localhost:5432 (same path
      # the PHP app uses). Postgres sees a local connection; no Remote whitelist.
      - name: Run Flyway migrations via SSH tunnel
        if: env.RUN_MIGRATIONS == 'true'
        env:
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PG_DB:?PG_DB secret is required}"
          : "${PG_USER:?PG_USER secret is required}"
          : "${PG_PASSWORD:?PG_PASSWORD secret is required}"

          SOCK="$HOME/.ssh/flyway-tunnel.sock"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          ssh -fN -M -S "$SOCK" \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -L 5432:127.0.0.1:5432 \
            -p "$SSH_PORT" \
            "$REMOTE"

          cleanup() {
            ssh -S "$SOCK" -O exit "$REMOTE" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 5432 2>/dev/null; then
              echo "✓ SSH tunnel listening on 127.0.0.1:5432"
              break
            fi
            sleep 1
          done
          nc -z 127.0.0.1 5432 2>/dev/null || { echo "Tunnel port 5432 not open"; exit 1; }

          docker run --rm --network host \
            -v "$PWD/db/migration:/flyway/sql:ro" \
            -e "FLYWAY_URL=jdbc:postgresql://127.0.0.1:5432/${PG_DB}" \
            -e "FLYWAY_USER=${PG_USER}" \
            -e "FLYWAY_PASSWORD=${PG_PASSWORD}" \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/sql \
            -e FLYWAY_CONNECT_RETRIES=10 \
            flyway/flyway:11 \
            migrate

      # - name: Dry-run deployment
      #   run: |
      #     echo "========================================"
      #     echo "DRY RUN - No files will be changed"
      #     echo "========================================"
      #     echo "Step 1: Deploy vendor/, src/, & composer.json to ~/www/$REMOTE_PATH/"
      #     rsync -chavzn --delete-after --keep-dirlinks \
      #       -e "ssh -p $SSH_PORT" \
      #       --include='vendor/***' \
      #       --include='src/***' \
      #       --include='composer.json' \
      #       --exclude='*' \
      #       ./ \
      #       ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/www/$REMOTE_PATH/
      #     echo ""
      #     echo "Step 2: Deploy public/ contents to ~/www/$REMOTE_PATH/public_html/"
      #     rsync -chavzn --delete --keep-dirlinks \
      #       -e "ssh -p $SSH_PORT" \
      #       ./public/ \
      #       ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/www/$REMOTE_PATH/public_html/
      #     echo "========================================"
      #     echo "Dry run complete. Review changes above."
      #     echo "========================================"

      - name: Deploy via Rsync
        run: |
          echo "Starting deployment..."
          echo "[1/3] Deploying vendor/, src/, and composer.json to root..."
          rsync -chavz --delete-after --keep-dirlinks \
            -e "ssh -p $SSH_PORT" \
            --include='vendor/***' \
            --include='src/***' \
            --include='composer.json' \
            --exclude='*' \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/www/$REMOTE_PATH/
          
          echo "[2/3] Deploying public/ to public_html/..."
          rsync -chavz --delete --keep-dirlinks \
            -e "ssh -p $SSH_PORT" \
            ./public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/www/$REMOTE_PATH/public_html/
          
          echo "✓ Deployment complete!"

        # -c compares file changes by checksum, not modification time
        # -h (or --human-readable) outputs numbers in a more human readable format
        # -a (or --archive) retains file attributes and permissions and recursively copies files and directories
        # -v (or --verbose): shows status output
        # -z (or --compress) Compresses file data during transfer
        # --delete deletes files from the destination that aren’t found in the source (anymore)
        # -n (or --dry-run): Performs a trial run without actually making any changes

  tagging:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ success() }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo at deployed commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git (bot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Move environment pointer tag
        run: |
          set -euo pipefail
          TAG="staging"         # Tag for main/master branch deployments
          SHA=$(git rev-parse HEAD)
          git fetch --tags
          git tag -d "$TAG" 2>/dev/null || true
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            git push origin :refs/tags/"$TAG"
          fi
          git tag -a "$TAG" -m "Deploy $TAG @ $SHA"
          git push origin "refs/tags/$TAG"        